<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Picks League</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',Arial,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
.header{text-align:center;padding:32px 24px 16px}
.header h1{font-size:32px;font-weight:900;text-transform:uppercase;letter-spacing:-1px;background:linear-gradient(135deg,#58a6ff,#3fb950);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.status{font-size:11px;color:#484f58;margin-top:8px}
.tabs{display:flex;justify-content:center;gap:4px;padding:0 24px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:8px 18px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#8b949e;font-size:13px;font-weight:600;cursor:pointer}
.tab:hover{border-color:#58a6ff;color:#e6edf3}
.tab.active{background:#58a6ff;color:#0d1117;border-color:#58a6ff}
.panel{display:none;max-width:900px;margin:0 auto;padding:0 24px 40px}
.panel.active{display:block}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden;margin-bottom:20px}
.card h2{padding:12px 16px;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.hdr1{background:linear-gradient(135deg,#1a3a5c,#1f4068)}
.hdr2{background:linear-gradient(135deg,#3d1e5c,#5a2d82)}
.hdr3{background:linear-gradient(135deg,#4a3020,#6b4226)}
.hdr4{background:linear-gradient(135deg,#1a1a2e,#2a2a4e)}
.hdr5{background:linear-gradient(135deg,#1a4a1e,#2d6a2f)}
.hdr6{background:linear-gradient(135deg,#2a4a4e,#1a6a6e)}
table{width:100%;border-collapse:collapse}
th{padding:8px 12px;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#8b949e;font-weight:600;text-align:center;border-bottom:1px solid #30363d;background:#1c2128}
td{padding:10px 12px;font-size:13px;text-align:center;border-bottom:1px solid #21262d}
tr:last-child td{border-bottom:none}
.r1{color:#FFD700;font-weight:800;font-size:14px}
.r2{color:#C0C0C0;font-weight:800;font-size:14px}
.r3{color:#CD7F32;font-weight:800;font-size:14px}
.nm{text-align:left;font-weight:600}
.tot{font-weight:800;color:#3fb950;font-size:15px}
.wk{color:#8b949e;font-size:12px}
.w{color:#3fb950;font-weight:600}
.l{color:#f85149;font-weight:600}
.t{color:#d29922;font-weight:600}
.dl{padding:8px 16px;font-size:12px;font-weight:700;color:#f0883e;background:#1c2128;border-bottom:1px solid #30363d;text-transform:uppercase;letter-spacing:.5px}
.qg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.qc{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px 16px;border-left:3px solid #58a6ff}
.qc .lb{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#8b949e;font-weight:600}
.qc .qn{font-size:18px;font-weight:800;margin-top:4px}
.qc .dt{font-size:12px;color:#8b949e;margin-top:2px}
.qc.wc{border-left-color:#d29922}
.qc .pr{display:inline-block;background:#2d6a4f;color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;margin-top:6px}
.er{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #21262d}
.er:last-child{border-bottom:none}
.en{font-weight:600;font-size:14px}
.ea{font-weight:800;color:#3fb950;font-size:16px}
.loading{text-align:center;padding:60px 24px;color:#8b949e;font-size:15px}
.wsel{padding:10px 16px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:14px;font-weight:600;font-family:'Inter',Arial,sans-serif;cursor:pointer;min-width:260px;text-align:center;display:block;margin:0 auto 16px}
.mu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:8px}
.mu{background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden}
.mu-header{display:flex;border-bottom:1px solid #30363d}
.mu-side{flex:1;padding:8px 10px;text-align:center}
.mu-side.left{border-right:1px solid #21262d}
.mu-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-score{font-size:26px;font-weight:900;color:#8b949e;margin-top:2px}
.mu-side.mw .mu-name{color:#3fb950}.mu-side.mw .mu-score{color:#3fb950}
.mu-side.ml .mu-name{color:#f85149;opacity:.7}.mu-side.ml .mu-score{color:#f85149;opacity:.7}
.mu-side.mt .mu-name{color:#d29922}.mu-side.mt .mu-score{color:#d29922}
@media(max-width:640px){.header h1{font-size:24px}.qg{grid-template-columns:1fr}td,th{padding:6px 8px;font-size:11px}.tab{padding:6px 12px;font-size:11px}.mu-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.mu-name{font-size:10px}.mu-score{font-size:20px}}
</style>
</head>
<body>
<div class="header"><h1>NFL Picks League</h1><div class="status" id="status">Loading...</div></div>
<div class="tabs">
<div class="tab active" onclick="show('sched',this)">Schedule</div>
<div class="tab" onclick="show('all',this)">Overall Standings</div>
<div class="tab" onclick="show('s1',this)">Segment 1 Standings</div>
<div class="tab" onclick="show('s2',this)">Segment 2 Standings</div>
<div class="tab" onclick="show('s3',this)">Segment 3 Standings</div>
<div class="tab" onclick="show('po',this)">Playoffs</div>
</div>
<div class="panel active" id="sched"><div class="loading">Loading...</div></div>
<div class="panel" id="all"><div class="loading">Loading...</div></div>
<div class="panel" id="s1"><div class="loading">Loading...</div></div>
<div class="panel" id="s2"><div class="loading">Loading...</div></div>
<div class="panel" id="s3"><div class="loading">Loading...</div></div>
<div class="panel" id="po"><div class="loading">Loading...</div></div>
<script>
var P = []; // all players

window.onload = function() { load(); setInterval(load, 300000); };

function show(id, el) {
  var panels = document.querySelectorAll('.panel');
  var tabs = document.querySelectorAll('.tab');
  for (var i=0;i<panels.length;i++) panels[i].className='panel';
  for (var i=0;i<tabs.length;i++) tabs[i].className='tab';
  document.getElementById(id).className='panel active';
  if(el) el.className='tab active';
}

function load() {
  fetch('./NFL_Picks_League_Tracker.xlsx?t='+Date.now())
  .then(function(r){return r.arrayBuffer()})
  .then(function(buf){
    var wb = XLSX.read(new Uint8Array(buf), {type:'array'});
    var h = wb.Sheets['Helper'];
    if(!h){document.getElementById('status').textContent='Helper sheet not found';return;}
    
    // Read roster
    var roster = wb.Sheets['Roster'];
    var names = {};
    if(roster){for(var i=3;i<=18;i++){var c=roster['B'+i];names[i-2]=c?c.v:'Player '+(i-2);}}
    
    // Read helper data
    P = [];
    for(var i=2;i<=17;i++){
      var pn = i-1;
      P.push({
        num: pn,
        name: names[pn]||'Player '+pn,
        w1:[v(h,'C'+i),v(h,'D'+i),v(h,'E'+i),v(h,'F'+i),v(h,'G'+i),v(h,'H'+i)],
        t1:v(h,'I'+i), h1:v(h,'J'+i),
        w2:[v(h,'L'+i),v(h,'M'+i),v(h,'N'+i),v(h,'O'+i),v(h,'P'+i),v(h,'Q'+i)],
        t2:v(h,'R'+i), h2:v(h,'S'+i),
        r3:[v3(h,'U'+i),v3(h,'V'+i),v3(h,'W'+i),v3(h,'X'+i),v3(h,'Y'+i),v3(h,'Z'+i)],
        w3:v(h,'AA'+i), l3:v(h,'AB'+i), p3:v(h,'AC'+i)
      });
    }
    
    // Read raw picks from input sheets
    readPicks(wb);
    
    render();
    document.getElementById('status').textContent='v5 | Updated: '+new Date().toLocaleString();
  })
  .catch(function(e){document.getElementById('status').textContent='Could not load file';});
}

function v(s,r){var c=s[r];return c&&typeof c.v==='number'?c.v:0;}
function v3(s,r){var c=s[r];return c?String(c.v):'-';}

// Raw picks storage: picks[weekNumber][playerNumber] = correct picks
var picks = {};

function readPicks(wb) {
  picks = {};
  var sheets = ['Wk 1-6 Input','Wk 7-12 Input','Wk 13-18 Input'];
  for (var s = 0; s < sheets.length; s++) {
    var ws = wb.Sheets[sheets[s]];
    if (!ws) continue;
    var ref = ws['!ref'];
    if (!ref) continue;
    var range = XLSX.utils.decode_range(ref);
    var curWeek = 0;
    for (var r = range.s.r; r <= range.e.r; r++) {
      var a = ws[XLSX.utils.encode_cell({r:r,c:0})];
      if (!a) continue;
      var av = a.v;
      // Detect week header
      if (typeof av === 'string' && av.toUpperCase().indexOf('WEEK ') === 0) {
        curWeek = parseInt(av.replace(/\D/g,''));
        if (!picks[curWeek]) picks[curWeek] = {};
        continue;
      }
      // Detect player row
      if (curWeek > 0 && typeof av === 'number' && av >= 1 && av <= 16) {
        var cc = ws[XLSX.utils.encode_cell({r:r,c:2})];
        var val = 0;
        if (cc) {
          if (typeof cc.v === 'number') val = cc.v;
          else if (typeof cc.v === 'string') val = parseInt(cc.v) || 0;
        }
        picks[curWeek][av] = val;
      }
    }
  }
}

function rc(i){return i===0?'r1':i===1?'r2':i===2?'r3':'';}

function render(){
  renderSched();
  renderS1();renderS2();renderS3();renderAll();renderPO();
}

// ===== SCHEDULE =====
function renderSched(){
  var A=[1,2,3,4],B=[5,6,7,8],C=[9,10,11,12],D=[13,14,15,16];
  function mr(g1,g2,g3,g4){
    var pm=[[0,1,2,3],[1,0,3,2],[2,3,0,1],[3,2,1,0]],out=[];
    for(var p=0;p<4;p++){var m=[];for(var i=0;i<4;i++)m.push([g1[i],g2[pm[p][i]]]);for(var i=0;i<4;i++)m.push([g3[i],g4[pm[p][i]]]);out.push(m);}
    return out;
  }
  var r1=mr(A,B,C,D),r2=mr(A,C,B,D),r3=mr(A,D,B,C);
  function ds(m){var f=m[0],ro=m.slice(1),rr=[];for(var i=0;i<3;i++){var c=[f].concat(ro);rr.push([[c[0],c[3]],[c[1],c[2]]]);ro=[ro[ro.length-1]].concat(ro.slice(0,ro.length-1));}return rr.concat(rr);}
  var da=ds(A),db=ds(B),dc=ds(C),dd=ds(D);
  
  var sched=[];
  for(var i=0;i<4;i++)sched.push({wk:i+1,seg:'Seg 1',mu:r1[i]});
  for(var i=0;i<2;i++)sched.push({wk:i+5,seg:'Seg 1',mu:r2[i]});
  for(var i=2;i<4;i++)sched.push({wk:i+5,seg:'Seg 2',mu:r2[i]});
  for(var i=0;i<4;i++)sched.push({wk:i+9,seg:'Seg 2',mu:r3[i]});
  for(var i=0;i<6;i++)sched.push({wk:i+13,seg:'Division',mu:da[i].concat(db[i]).concat(dc[i]).concat(dd[i])});
  
  var pm={};for(var i=0;i<P.length;i++)pm[P[i].num]=P[i];
  
  var o='<select class="wsel" onchange="sw(this.value)">';
  for(var i=0;i<sched.length;i++)o+='<option value="'+i+'">Week '+sched[i].wk+' — '+sched[i].seg+'</option>';
  o+='</select>';
  
  for(var i=0;i<sched.length;i++){
    var s=sched[i];
    o+='<div id="wk'+i+'" style="display:'+(i===0?'block':'none')+'"><div class="mu-grid">';
    for(var j=0;j<s.mu.length;j++){
      var n1=s.mu[j][0],n2=s.mu[j][1];
      var p1=pm[n1],p2=pm[n2];
      var name1=p1?p1.name:'Player '+n1;
      var name2=p2?p2.name:'Player '+n2;
      
      // Get raw picks for this week
      var sc1=picks[s.wk]?picks[s.wk][n1]:'';
      var sc2=picks[s.wk]?picks[s.wk][n2]:'';
      if(sc1===undefined||sc1===null)sc1=0;
      if(sc2===undefined||sc2===null)sc2=0;
      
      var c1='',c2='';
      if(sc1>0||sc2>0){
        if(sc1>sc2){c1='mw';c2='ml';}
        else if(sc2>sc1){c2='mw';c1='ml';}
        else{c1='mt';c2='mt';}
      }
      
      o+='<div class="mu">';
      o+='<div class="mu-header">';
      o+='<div class="mu-side left '+c1+'"><div class="mu-name">'+name1+'</div><div class="mu-score">'+sc1+'</div></div>';
      o+='<div class="mu-side '+c2+'"><div class="mu-name">'+name2+'</div><div class="mu-score">'+sc2+'</div></div>';
      o+='</div></div>';
    }
    o+='</div></div>';
  }
  document.getElementById('sched').innerHTML=o;
}
function sw(i){var a=document.querySelectorAll('[id^="wk"]');for(var x=0;x<a.length;x++){if(a[x].id.indexOf('wk')===0&&a[x].id.length<=4)a[x].style.display='none';}document.getElementById('wk'+i).style.display='block';}

// ===== STANDINGS =====
function renderS1(){
  // Add raw picks to each player
  for(var i=0;i<P.length;i++){
    P[i].rp1=[];var rpTotal=0;
    for(var w=1;w<=6;w++){var v=(picks[w]&&picks[w][P[i].num])||0;P[i].rp1.push(v);rpTotal+=v;}
    P[i].rp1Total=rpTotal;
  }
  var s=P.slice().sort(function(a,b){return b.t1-a.t1||b.h1-a.h1;});
  var wn=['Wk 1','Wk 2','Wk 3','Wk 4','Wk 5','Wk 6'];
  var o='<div class="card"><h2 class="hdr1">Segment 1 — Weeks 1-6</h2><table><tr><th>#</th><th style="text-align:left">Player</th>';
  for(var i=0;i<6;i++)o+='<th>'+wn[i]+'</th>';
  o+='<th>H2H W</th><th>Best</th><th>Picks</th></tr>';
  for(var i=0;i<s.length;i++){
    o+='<tr><td class="'+rc(i)+'">'+(i+1)+'</td><td class="nm">'+s[i].name+'</td>';
    for(var w=0;w<6;w++)o+='<td class="wk">'+s[i].rp1[w]+'</td>';
    var bw=Math.max.apply(null,s[i].rp1);
    o+='<td>'+s[i].h1+'</td><td>'+bw+'</td><td class="tot">'+s[i].rp1Total+'</td></tr>';
  }
  o+='</table></div>';document.getElementById('s1').innerHTML=o;
}
function renderS2(){
  for(var i=0;i<P.length;i++){
    P[i].rp2=[];var rpTotal=0;
    for(var w=7;w<=12;w++){var v=(picks[w]&&picks[w][P[i].num])||0;P[i].rp2.push(v);rpTotal+=v;}
    P[i].rp2Total=rpTotal;
  }
  var s=P.slice().sort(function(a,b){return b.t2-a.t2||b.h2-a.h2;});
  var wn=['Wk 7','Wk 8','Wk 9','Wk 10','Wk 11','Wk 12'];
  var o='<div class="card"><h2 class="hdr2">Segment 2 — Weeks 7-12</h2><table><tr><th>#</th><th style="text-align:left">Player</th>';
  for(var i=0;i<6;i++)o+='<th>'+wn[i]+'</th>';
  o+='<th>H2H W</th><th>Best</th><th>Pts</th></tr>';
  for(var i=0;i<s.length;i++){
    o+='<tr><td class="'+rc(i)+'">'+(i+1)+'</td><td class="nm">'+s[i].name+'</td>';
    for(var w=0;w<6;w++)o+='<td class="wk">'+s[i].rp2[w]+'</td>';
    var bw=Math.max.apply(null,s[i].rp2);
    o+='<td>'+s[i].h2+'</td><td>'+bw+'</td><td class="tot">'+s[i].rp2Total+'</td></tr>';
  }
  o+='</table></div>';document.getElementById('s2').innerHTML=o;
}
function renderS3(){
  var divs=[{n:'Division A',p:P.filter(function(x){return x.num<=4})},{n:'Division B',p:P.filter(function(x){return x.num>=5&&x.num<=8})},{n:'Division C',p:P.filter(function(x){return x.num>=9&&x.num<=12})},{n:'Division D',p:P.filter(function(x){return x.num>=13})}];
  var wn=['W13','W14','W15','W16','W17','W18'];
  var o='<div class="card"><h2 class="hdr3">Segment 3 — Weeks 13-18</h2>';
  for(var d=0;d<divs.length;d++){
    var s=divs[d].p.slice().sort(function(a,b){return b.w3-a.w3||b.p3-a.p3;});
    o+='<div class="dl">'+divs[d].n+'</div><table><tr><th>#</th><th style="text-align:left">Player</th>';
    for(var i=0;i<6;i++)o+='<th>'+wn[i]+'</th>';
    o+='<th>W</th><th>L</th><th>Picks</th></tr>';
    for(var i=0;i<s.length;i++){
      o+='<tr><td class="'+rc(i)+'">'+(i+1)+'</td><td class="nm">'+s[i].name+'</td>';
      for(var w=0;w<6;w++){var r=s[i].r3[w];var cl=r==='W'?'w':r==='L'?'l':r==='T'?'t':'wk';o+='<td class="'+cl+'">'+r+'</td>';}
      o+='<td class="w">'+s[i].w3+'</td><td class="l">'+s[i].l3+'</td><td>'+s[i].p3+'</td></tr>';
    }o+='</table>';
  }
  o+='</div>';document.getElementById('s3').innerHTML=o;
}
function renderAll(){
  var s=P.slice().sort(function(a,b){return(b.t1+b.t2+b.p3)-(a.t1+a.t2+a.p3);});
  var o='<div class="card"><h2 class="hdr4">Overall Season Standings</h2><table><tr><th>#</th><th style="text-align:left">Player</th><th>Seg 1</th><th>Seg 2</th><th>Seg 3</th><th>Picks</th></tr>';
  for(var i=0;i<s.length;i++){
    var rp1t=s[i].rp1Total||0,rp2t=s[i].rp2Total||0,rp3=s[i].p3;
    var t=rp1t+rp2t+rp3;
    o+='<tr><td class="'+rc(i)+'">'+(i+1)+'</td><td class="nm">'+s[i].name+'</td><td class="wk">'+rp1t+'</td><td class="wk">'+rp2t+'</td><td class="wk">'+rp3+'</td><td class="tot">'+t+'</td></tr>';}
  o+='</table></div>';document.getElementById('all').innerHTML=o;
}
function renderPO(){
  var s1=P.slice().sort(function(a,b){return b.t1-a.t1;});
  var s2=P.slice().sort(function(a,b){return b.t2-a.t2;});
  var dv=[P.filter(function(x){return x.num<=4}),P.filter(function(x){return x.num>=5&&x.num<=8}),P.filter(function(x){return x.num>=9&&x.num<=12}),P.filter(function(x){return x.num>=13})];
  var dw=dv.map(function(d){return d.slice().sort(function(a,b){return b.w3-a.w3||b.p3-a.p3;})[0];});
  var dn=['Div A','Div B','Div C','Div D'];
  var q=new Set(),qs=[];
  function addQ(label,winner,pool,prize,stat){var qual=pool.find(function(p){return!q.has(p.num);})||winner;q.add(qual.num);qs.push({l:label,w:winner.name,q:qual.name,pr:prize,pt:stat});}
  addQ('Weeks 1-6 Winner',s1[0],s1,'$25',s1[0].t1+' pts');
  addQ('Weeks 7-12 Winner',s2[0],s2,'$25',s2[0].t2+' pts');
  for(var i=0;i<4;i++){var ds=dv[i].slice().sort(function(a,b){return b.w3-a.w3||b.p3-a.p3;});addQ(dn[i]+' Winner',dw[i],ds,'$10',dw[i].w3+'W-'+dw[i].l3+'L');}
  var os=P.slice().sort(function(a,b){return(b.t1+b.t2+b.p3)-(a.t1+a.t2+a.p3);});
  var wcs=os.filter(function(p){return!q.has(p.num);}).slice(0,2);
  var o='<div class="card"><h2 class="hdr5">Playoff Picture</h2></div><div class="qg">';
  for(var i=0;i<qs.length;i++){var x=qs[i];var ps=x.w!==x.q;o+='<div class="qc"><div class="lb">'+x.l+'</div><div class="qn">'+x.w+'</div><div class="dt">'+x.pt+(ps?' — entry passes to '+x.q:'')+'</div><span class="pr">'+x.pr+'</span></div>';}
  for(var i=0;i<wcs.length;i++){var p=wcs[i];o+='<div class="qc wc"><div class="lb">Wild Card '+(i+1)+'</div><div class="qn">'+p.name+'</div><div class="dt">'+(p.t1+p.t2+p.p3)+' season pts</div></div>';}
  o+='</div>';
  var earn=P.map(function(p){var e=0;if(p.name===s1[0].name)e+=25;if(p.name===s2[0].name)e+=25;if(dw.some(function(d){return d.name===p.name;}))e+=10;return{name:p.name,amount:e};}).filter(function(x){return x.amount>0;}).sort(function(a,b){return b.amount-a.amount;});
  if(earn.length>0){o+='<div class="card"><h2 class="hdr5">Season Earnings</h2><div style="padding:16px">';for(var i=0;i<earn.length;i++)o+='<div class="er"><span class="en">'+earn[i].name+'</span><span class="ea">$'+earn[i].amount+'</span></div>';o+='</div></div>';}
  document.getElementById('po').innerHTML=o;
}
</script>
