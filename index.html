<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 NFL Schedule</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}

.header{text-align:center;padding:28px 24px 8px}
.header h1{font-size:28px;font-weight:900;letter-spacing:-0.5px;color:#e6edf3}
.header .sub{font-size:13px;color:#8b949e;margin-top:4px;font-weight:500}

.week-nav{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 24px 6px}
.week-btn{width:36px;height:36px;border-radius:50%;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.week-btn:hover{border-color:#58a6ff;color:#58a6ff}
.week-btn:disabled{opacity:.3;cursor:default;border-color:#30363d;color:#484f58}
.week-label{font-size:22px;font-weight:800;min-width:120px;text-align:center}
.week-seg{text-align:center;font-size:11px;color:#8b949e;font-weight:600;padding:4px 0 16px;letter-spacing:.3px}

.bye-bar{max-width:720px;margin:0 auto 14px;padding:8px 16px;background:#161b22;border:1px solid #21262d;border-radius:8px;text-align:center;font-size:12px;color:#6e7681}
.bye-bar span{color:#8b949e;font-weight:600}

.games-grid{max-width:720px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:6px}

.game-card{display:flex;align-items:center;background:#161b22;border:1px solid #21262d;border-radius:10px;overflow:hidden;height:64px;transition:border-color .15s}
.game-card:hover{border-color:#30363d}

.team-side{flex:1;display:flex;align-items:center;gap:10px;padding:0 14px;height:100%}
.team-side.away{justify-content:flex-end;text-align:right;flex-direction:row-reverse}
.team-side.home{justify-content:flex-start}

.team-logo{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;background:#1c2128}
.team-logo img{width:36px;height:36px;object-fit:contain}
.team-logo .fallback{font-size:11px;font-weight:800;color:#8b949e;letter-spacing:-.3px}

.team-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e6edf3}

.at-divider{width:32px;flex-shrink:0;text-align:center;font-size:11px;font-weight:700;color:#484f58;letter-spacing:.5px}

@media(max-width:600px){
  .header h1{font-size:22px}
  .week-label{font-size:18px;min-width:100px}
  .team-name{font-size:12px}
  .team-logo{width:34px;height:34px}
  .team-logo img{width:30px;height:30px}
  .team-side{padding:0 10px;gap:8px}
  .game-card{height:56px}
  .at-divider{width:26px;font-size:10px}
  .games-grid{padding:0 12px 32px;gap:5px}
}
</style>
</head>
<body>

<div class="header">
  <h1>2026 NFL Schedule</h1>
  <div class="sub">18-Week Regular Season</div>
</div>

<div class="week-nav">
  <button class="week-btn" id="prevBtn" onclick="changeWeek(-1)">&#8249;</button>
  <div class="week-label" id="weekLabel">Week 1</div>
  <button class="week-btn" id="nextBtn" onclick="changeWeek(1)">&#8250;</button>
</div>
<div class="week-seg" id="weekSeg"></div>

<div class="bye-bar" id="byeBar" style="display:none"></div>
<div class="games-grid" id="gamesGrid"></div>

<script>
// ============================================================
// TEAM DATA + ESPN LOGO MAPPING
// ============================================================
var TEAMS = {
  ARI:{name:'Cardinals',full:'Arizona Cardinals',espn:'ari'},
  ATL:{name:'Falcons',full:'Atlanta Falcons',espn:'atl'},
  BAL:{name:'Ravens',full:'Baltimore Ravens',espn:'bal'},
  BUF:{name:'Bills',full:'Buffalo Bills',espn:'buf'},
  CAR:{name:'Panthers',full:'Carolina Panthers',espn:'car'},
  CHI:{name:'Bears',full:'Chicago Bears',espn:'chi'},
  CIN:{name:'Bengals',full:'Cincinnati Bengals',espn:'cin'},
  CLE:{name:'Browns',full:'Cleveland Browns',espn:'cle'},
  DAL:{name:'Cowboys',full:'Dallas Cowboys',espn:'dal'},
  DEN:{name:'Broncos',full:'Denver Broncos',espn:'den'},
  DET:{name:'Lions',full:'Detroit Lions',espn:'det'},
  GB:{name:'Packers',full:'Green Bay Packers',espn:'gb'},
  HOU:{name:'Texans',full:'Houston Texans',espn:'hou'},
  IND:{name:'Colts',full:'Indianapolis Colts',espn:'ind'},
  JAX:{name:'Jaguars',full:'Jacksonville Jaguars',espn:'jax'},
  KC:{name:'Chiefs',full:'Kansas City Chiefs',espn:'kc'},
  LAC:{name:'Chargers',full:'Los Angeles Chargers',espn:'lac'},
  LAR:{name:'Rams',full:'Los Angeles Rams',espn:'lar'},
  LV:{name:'Raiders',full:'Las Vegas Raiders',espn:'lv'},
  MIA:{name:'Dolphins',full:'Miami Dolphins',espn:'mia'},
  MIN:{name:'Vikings',full:'Minnesota Vikings',espn:'min'},
  NE:{name:'Patriots',full:'New England Patriots',espn:'ne'},
  NO:{name:'Saints',full:'New Orleans Saints',espn:'no'},
  NYG:{name:'Giants',full:'New York Giants',espn:'nyg'},
  NYJ:{name:'Jets',full:'New York Jets',espn:'nyj'},
  PHI:{name:'Eagles',full:'Philadelphia Eagles',espn:'phi'},
  PIT:{name:'Steelers',full:'Pittsburgh Steelers',espn:'pit'},
  SF:{name:'49ers',full:'San Francisco 49ers',espn:'sf'},
  SEA:{name:'Seahawks',full:'Seattle Seahawks',espn:'sea'},
  TB:{name:'Buccaneers',full:'Tampa Bay Buccaneers',espn:'tb'},
  TEN:{name:'Titans',full:'Tennessee Titans',espn:'ten'},
  WAS:{name:'Commanders',full:'Washington Commanders',espn:'wsh'}
};

function logoUrl(abbr) {
  var t = TEAMS[abbr];
  if (!t) return '';
  return 'https://a.espncdn.com/i/teamlogos/nfl/500/' + t.espn + '.png';
}

// ============================================================
// 2026 NFL SCHEDULE — Re-transcribed from corrected grid
// '@' = away, plain = home, 'BYE' = bye week
// ============================================================
var SCHED = {
  ARI:['@LAC','SEA','@SF','@NYG','DET','@LAR','DEN','@DAL','@SEA','LAR','@KC','WAS','PHI','BYE','NYJ','@NO','LV','SF'],
  ATL:['@PIT','CAR','@GB','@NO','BAL','CHI','SF','@TB','CIN','KC','BYE','@MIN','DET','@CLE','@WAS','TB','NO','@CAR'],
  BAL:['@IND','NO','@DAL','TEN','@ATL','@CLE','CIN','@BUF','JAX','LAC','@CAR','@HOU','BYE','TB','@PIT','CLE','@CIN','PIT'],
  BUF:['@HOU','DET','LAC','NE','@LAR','@LV','BYE','BAL','@MIN','@NYJ','MIA','KC','@NE','@GB','CHI','@DEN','@MIA','NYJ'],
  CAR:['CHI','@ATL','@CLE','DET','BYE','@PHI','TB','@GB','DEN','@NO','BAL','@TB','@MIN','NO','CIN','@PIT','SEA','ATL'],
  CHI:['@CAR','MIN','PHI','NYJ','@GB','@ATL','NE','@SEA','TB','BYE','NO','@DET','JAX','@MIA','@BUF','GB','DET','@MIN'],
  CIN:['TB','@HOU','@PIT','JAX','@MIA','BYE','@BAL','TEN','@ATL','PIT','@WAS','NO','@CLE','KC','@CAR','@IND','BAL','CLE'],
  CLE:['@JAX','@TB','CAR','PIT','@NYJ','BAL','@TEN','@PIT','@NO','HOU','BYE','LV','CIN','ATL','NYG','@BAL','IND','@CIN'],
  DAL:['@NYG','WAS','BAL','@HOU','TB','@GB','@PHI','ARI','@IND','SF','TEN','PHI','@SEA','BYE','@LAR','JAX','NYG','@WAS'],
  DEN:['@KC','JAX','LAR','@SF','@LAC','SEA','@ARI','KC','@CAR','BYE','LV','@PIT','MIA','@NYJ','@LV','BUF','@NE','LAC'],
  DET:['NO','@BUF','NYJ','@CAR','@ARI','BYE','GB','MIN','@MIA','NE','TB','CHI','@ATL','TEN','@MIN','NYG','@CHI','@GB'],
  GB:['@MIN','@NYJ','ATL','@TB','CHI','DAL','@DET','CAR','@NE','MIN','BYE','@LAR','@NO','BUF','MIA','@CHI','@HOU','DET'],
  HOU:['BUF','CIN','@IND','DAL','@TEN','@JAX','NYG','BYE','@LAC','@CLE','IND','BAL','@PIT','WAS','JAX','@PHI','GB','TEN'],
  IND:['BAL','@KC','HOU','@WAS','@PIT','TEN','@MIN','@JAX','DAL','@MIA','@HOU','NYG','BYE','@PHI','@TEN','CIN','@CLE','JAX'],
  JAX:['CLE','@DEN','NE','@CIN','PHI','HOU','BYE','IND','@BAL','@TEN','@NYG','TEN','@CHI','PIT','@HOU','@DAL','WAS','@IND'],
  KC:['DEN','IND','@MIA','@LV','BYE','LAC','@SEA','@DEN','NYJ','@ATL','ARI','@BUF','@LAR','@CIN','NE','SF','@LAC','LV'],
  LAC:['ARI','LV','@BUF','@SEA','DEN','@KC','BYE','@LAR','HOU','@BAL','NYJ','NE','@TB','@LV','SF','@MIA','KC','@DEN'],
  LAR:['SF','NYG','@DEN','@PHI','BUF','ARI','@LV','LAC','@WAS','@ARI','BYE','GB','KC','@SF','DAL','@SEA','@TB','SEA'],
  LV:['MIA','@LAC','@NO','KC','@NE','BUF','LAR','NYJ','@SF','SEA','@DEN','@CLE','BYE','LAC','DEN','TEN','@ARI','@KC'],
  MIA:['@LV','@SF','KC','@MIN','CIN','BYE','@NYJ','NE','DET','IND','@BUF','NYJ','@DEN','CHI','@GB','LAC','BUF','@NE'],
  MIN:['GB','@CHI','@TB','MIA','@NO','BYE','IND','@DET','BUF','@GB','@SF','ATL','CAR','@NE','DET','WAS','@NYJ','CHI'],
  NE:['@SEA','PIT','@JAX','@BUF','LV','NYJ','@CHI','@MIA','GB','@DET','BYE','@LAC','BUF','MIN','@KC','@NYJ','DEN','MIA'],
  NO:['@DET','@BAL','LV','ATL','MIN','@NYG','PIT','BYE','CLE','CAR','@CHI','@CIN','GB','@CAR','@TB','ARI','@ATL','TB'],
  NYG:['DAL','@LAR','TEN','ARI','@WAS','NO','@HOU','BYE','@PHI','WAS','JAX','@IND','SF','@SEA','@CLE','@DET','@DAL','PHI'],
  NYJ:['@TEN','GB','@DET','@CHI','CLE','@NE','MIA','@LV','@KC','BUF','@LAC','@MIA','BYE','DEN','@ARI','NE','MIN','@BUF'],
  PHI:['WAS','@TEN','@CHI','LAR','@JAX','CAR','DAL','@WAS','NYG','BYE','PIT','@DAL','@ARI','IND','SEA','HOU','@SF','@NYG'],
  PIT:['ATL','@NE','CIN','@CLE','IND','@TB','@NO','CLE','BYE','@CIN','@PHI','DEN','HOU','@JAX','BAL','CAR','@TEN','@BAL'],
  SF:['@LAR','MIA','ARI','DEN','@SEA','WAS','@ATL','BYE','LV','@DAL','MIN','SEA','@NYG','LAR','@LAC','@KC','PHI','@ARI'],
  SEA:['NE','@ARI','@WAS','LAC','SF','@DEN','KC','CHI','ARI','@LV','BYE','@SF','DAL','NYG','@PHI','LAR','@CAR','@LAR'],
  TB:['@CIN','CLE','MIN','GB','@DAL','PIT','@CAR','ATL','@CHI','BYE','@DET','CAR','LAC','@BAL','NO','@ATL','LAR','@NO'],
  TEN:['NYJ','PHI','@NYG','@BAL','HOU','@IND','CLE','@CIN','BYE','JAX','@DAL','@JAX','@WAS','@DET','IND','@LV','PIT','@HOU'],
  WAS:['@PHI','@DAL','SEA','IND','NYG','@SF','BYE','PHI','LAR','@NYG','CIN','@ARI','TEN','@HOU','ATL','@MIN','@JAX','DAL']
};

// ============================================================
// DERIVE GAMES PER WEEK
// ============================================================
var GAMES = {};
for (var w = 1; w <= 18; w++) {
  GAMES[w] = [];
  var used = {};
  for (var t in SCHED) {
    var opp = SCHED[t][w-1];
    if (!opp || opp === 'BYE' || used[t]) continue;
    var isAway = opp.charAt(0) === '@';
    var oppAbbr = isAway ? opp.substring(1) : opp;
    if (used[oppAbbr]) continue;
    used[t] = true;
    used[oppAbbr] = true;
    if (isAway) {
      GAMES[w].push({away:t, home:oppAbbr});
    } else {
      GAMES[w].push({away:oppAbbr, home:t});
    }
  }
}

function getSegment(w) {
  if (w <= 6) return 'Segment 1 · Weeks 1–6';
  if (w <= 12) return 'Segment 2 · Weeks 7–12';
  return 'Segment 3 · Weeks 13–18';
}

function getCurrentWeek() {
  var start = new Date(2026, 8, 10);
  var now = new Date();
  if (now < start) return 1;
  var diff = Math.floor((now - start) / (7*24*60*60*1000));
  return Math.max(1, Math.min(diff + 1, 18));
}

var currentWeek = getCurrentWeek();

// ============================================================
// RENDER
// ============================================================
function renderWeek(week) {
  currentWeek = week;
  document.getElementById('weekLabel').textContent = 'Week ' + week;
  document.getElementById('weekSeg').textContent = getSegment(week);
  document.getElementById('prevBtn').disabled = (week <= 1);
  document.getElementById('nextBtn').disabled = (week >= 18);

  var byes = [];
  for (var t in SCHED) {
    if (SCHED[t][week-1] === 'BYE') byes.push(TEAMS[t].full);
  }
  var byeEl = document.getElementById('byeBar');
  if (byes.length > 0) {
    byes.sort();
    byeEl.style.display = 'block';
    byeEl.innerHTML = '<span>Bye Week</span>&ensp;' + byes.join(' &middot; ');
  } else {
    byeEl.style.display = 'none';
  }

  var games = GAMES[week] || [];
  var html = '';
  for (var i = 0; i < games.length; i++) {
    var g = games[i];
    var away = TEAMS[g.away];
    var home = TEAMS[g.home];
    if (!away || !home) continue;

    html += '<div class="game-card">';
    html += '<div class="team-side away">';
    html += '<div class="team-logo"><img src="'+logoUrl(g.away)+'" alt="'+g.away+'" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'"><span class="fallback" style="display:none">'+g.away+'</span></div>';
    html += '<div class="team-name">'+away.full+'</div>';
    html += '</div>';
    html += '<div class="at-divider">@</div>';
    html += '<div class="team-side home">';
    html += '<div class="team-logo"><img src="'+logoUrl(g.home)+'" alt="'+g.home+'" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'"><span class="fallback" style="display:none">'+g.home+'</span></div>';
    html += '<div class="team-name">'+home.full+'</div>';
    html += '</div>';
    html += '</div>';
  }

  document.getElementById('gamesGrid').innerHTML = html;
}

function changeWeek(delta) {
  var next = currentWeek + delta;
  if (next >= 1 && next <= 18) renderWeek(next);
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') changeWeek(-1);
  if (e.key === 'ArrowRight') changeWeek(1);
});

var touchX = 0;
document.addEventListener('touchstart', function(e){touchX = e.touches[0].clientX;});
document.addEventListener('touchend', function(e){
  var dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 60) changeWeek(dx < 0 ? 1 : -1);
});

renderWeek(currentWeek);
</script>
</body>
</html>
